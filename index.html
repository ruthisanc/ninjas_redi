<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReDi Ninjas Class</title>
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f1ea;
    color: #222;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 2.2rem; text-align: center; margin: 0 0 24px; }
  .links { display: flex; flex-direction: column; gap: 14px; }
  .links a {
    display: block;
    padding: 20px 24px;
    font-size: 1.5rem;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    color: #fff;
    background: #2b6cb0;
    border-radius: 14px;
    box-shadow: 0 4px 0 #1e4e80;
  }
  .links a:nth-child(4n+2) { background: #2f855a; box-shadow: 0 4px 0 #22643f; }
  .links a:nth-child(4n+3) { background: #c05621; box-shadow: 0 4px 0 #8f3f17; }
  .links a:nth-child(4n+4) { background: #6b46c1; box-shadow: 0 4px 0 #4c3290; }
  .links a:hover, .links a:focus { filter: brightness(1.1); outline: 3px solid #222; }
</style>
</head>
<body>
<main>
  <h1>ReDi Ninjas Class: Links</h1>
  <nav class="links">

<!-- ===== EDIT HERE: one link per line =====
     Copy a line, change the address and the name. Delete lines you don't need. -->

    <a href="https://makecode.calliope.cc/" target="_blank">MakeCode</a>
    <a href="https://margaridasp.github.io/blockly-games/maze?lang=de" target="_blank">S2: Blockly Games</a>
    <a href="https://studio.code.org/flappy/1" target="_blank">S2: Flappy Game</a>

<!-- ===== END OF LINKS ===== -->

  </nav>
</main>
</body>
</html>
